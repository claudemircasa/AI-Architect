[project]
name = "nnarch"
version = "0.1.0"
description = "AI Architect backend — Keras 3 / TensorFlow architecture prototyping engine"
requires-python = ">=3.13,<3.14"
dependencies = [
    "tensorflow==2.21.*",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=1.26",
    "pillow>=10.4",
    "soundfile>=0.12",
    "python-multipart>=0.0.12",
    "scipy>=1.14",
]

[project.optional-dependencies]
audio = ["librosa>=0.10"]
dev = ["pytest>=8.3", "httpx>=0.27"]

[project.scripts]
nnarch-engine = "nnarch.api.server:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: spawns a subprocess and trains a model; excluded with -m 'not slow'"]
